<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Integrador </title>
    <link rel="stylesheet" href="../integrador/css/style.css">
</head>
<body>
    <header>
        <h1>Bibloteca de Joaco</h1>
    </header>

    <main>
        <section id="agregar-libro">
            <h2>Agregar libro</h2>
            <form action="">
                <div>
                    <label for="titulo"> Titulo </label>
                    <input type="text" name="titulo" id="titulo" required>
                </div>

                <div>
                    <label for="autor"> Autor </label>
                    <input type="text" name="autor" id="autor" required>
                </div>

                <div>
                    <label for="genero"> Genero </label>
                    <input type="text" name="genero" id="genero" required>
                </div>

                <div>
                    <label for="anio"> Año </label>
                    <input type="number" name="anio" id="anio" required>
                </div>

                <input type="submit" name="enviar" id="enviar" value="Cargar libro">
            </form>
        </section>

        

        <section id="catalogo"> 
            <h2>catalogo</h2>
        </section>

        <section id="filtrar">
            <h2> filtar</h2>
            <div>
                <label for="titulo-buscar"> Titulo a Buscar </label>
                <input type="text" name="titulo-buscar" id="titulo-buscar" required>
            </div>

            <div>
                <label for="genero-buscar"> Genero </label>
                <select name="genero-buscar" id="genero-buscar"> </select>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
