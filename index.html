<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Integrador </title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Biblioteca de Joaco</h1>
    </header>

    <main>
        <section id="agregar-libro">
            <h2>Agregar libro</h2>
            <form id="form-agregar-libro">
                <div>
                    <label for="titulo"> Titulo </label>
                    <input type="text" name="titulo" id="titulo" required>
                </div>

                <div>
                    <label for="autor"> Autor </label>
                    <input type="text" name="autor" id="autor" required>
                </div>

                <div>
                    <label for="genero"> Genero </label>
                    <input type="text" name="genero" id="genero" required>
                </div>

                <div>
                    <label for="anio"> Año </label>
                    <input type="number" name="anio" id="anio" required>
                </div>

                <input type="submit" name="enviar" id="enviar" value="Cargar libro">
            </form>
        </section>

        

        <section id="catalogo"> 
            <h2>CATALOGO</h2>
            <div id="lista-libros">

            </div>
        </section>

        <section id="filtrar">
            <h2> filtar</h2>
            <div>
                <label for="titulo-buscar"> Titulo a Buscar </label>
                <input type="text" name="titulo-buscar" id="titulo-buscar" required>
            </div>
            <div>
                <label for="ver-favs"> Ver favoritos </label>
                <input type="checkbox" name="ver-favs" id="ver-favs">
            </div>

            <div>
                <label for="genero-buscar"> Genero </label>
                <select name="genero-buscar" id="genero-buscar"> 
                    <option value="Todos">Todos</option>
                </select>
                
            </div>

        </section>
    </main>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
